[project]
name = "bookrats"
version = "0.1.0"
description = "Bookrats kosync server and Goodreads poller"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
